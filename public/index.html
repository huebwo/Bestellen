<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bestellen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
               -webkit-touch-callout: none; }
  body { position: fixed; inset: 0; }
  button { touch-action: manipulation; }
  .panel, .panel * { touch-action: pan-y; }
  input { touch-action: auto; -webkit-user-select: text; user-select: text; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
  }
  #fw { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; text-align: center; }
  .counter {
    font-size: 72px; font-weight: 800; letter-spacing: 1px;
    font-variant-numeric: tabular-nums; margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(80,160,255,.6);
    transition: transform .08s;
  }
  .counter.pop { transform: scale(1.18); }
  .unit { font-size: 15px; opacity: .7; margin-top: -4px; }
  .total { font-size: 14px; opacity: .5; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .level { font-size: 16px; opacity: .75; margin-bottom: 28px; min-height: 1.2em; }
  .btn {
    --size: 220px;
    width: var(--size); height: var(--size);
    font-size: 28px; font-weight: 700; color: #fff;
    background: radial-gradient(circle at 35% 30%, #5aa2ff, #1f6feb 55%, #0b3d99);
    border: none; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 30px rgba(31,111,235,.7), 0 0 80px rgba(31,111,235,.35);
    transition: transform .06s, box-shadow .2s, width .3s, height .3s;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(0.92); }
  .btn.gold {
    background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc400 55%, #b07800);
    box-shadow: 0 0 40px rgba(255,196,0,.9), 0 0 120px rgba(255,196,0,.5);
    color: #3a2600;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 30px rgba(31,111,235,.7), 0 0 80px rgba(31,111,235,.35); }
    50%     { box-shadow: 0 0 45px rgba(31,111,235,.9), 0 0 120px rgba(31,111,235,.5); }
  }
  .combo {
    margin-top: 24px; font-size: 22px; font-weight: 700; min-height: 1.3em;
    color: #ffd84d; text-shadow: 0 0 12px rgba(255,216,77,.7);
  }
  .bar { width: 240px; height: 6px; margin: 10px auto 0; background: #222; border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg,#4dc3ff,#c44dff,#ff4d4d); transition: width .15s; }
  .toast {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%) scale(.6);
    font-size: 40px; font-weight: 900; opacity: 0; pointer-events: none; z-index: 2;
    transition: opacity .25s, transform .25s; white-space: nowrap;
    text-shadow: 0 0 20px currentColor;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .top3 { position: fixed; top: 12px; right: 14px; z-index: 2; text-align: right; font-size: 14px;
          background: rgba(20,20,28,.75); border: 1px solid #262636; border-radius: 10px; padding: 10px 14px; min-width: 190px; }
  .top3 h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: .6; }
  .top3 .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .top3 .row b { font-weight: 700; }
  .top3 .me { color: #4dc3ff; }
  .top3 .empty { opacity: .5; font-size: 13px; }
  .top3 button, .player button { margin-top: 8px; background: #1f6feb; color: #fff; border: none; border-radius: 6px;
          padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .player { position: fixed; bottom: 14px; left: 14px; z-index: 2; font-size: 13px; opacity: .8; }
  .player span { color: #4dc3ff; font-weight: 600; }
  .player button { background: none; border: 1px solid #333; color: #aaa; margin: 0 0 0 8px; padding: 3px 8px; }
  .note { font-size: 11px; opacity: .5; margin-top: 6px; max-width: 200px; margin-left: auto; }
  .overlay { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.82); display: none;
             align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .panel { background: #111118; border: 1px solid #2a2a3a; border-radius: 14px; padding: 22px 26px;
           max-width: 92vw; max-height: 80vh; overflow: auto; }
  .panel h2 { margin: 0 0 14px; font-size: 22px; }
  .panel { width: min(440px, 92vw); box-sizing: border-box; }
  .blist { display: flex; flex-direction: column; gap: 8px; }
  .brow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
          background: #181822; border: 1px solid #23232f; }
  .brow.podium { background: #1c1c2a; }
  .brow.me { border-color: #1f6feb; box-shadow: 0 0 0 1px #1f6feb inset; }
  .brow .rank { width: 30px; text-align: center; font-size: 18px; font-weight: 700; opacity: .9; flex: none; }
  .brow .who { flex: 1; min-width: 0; }
  .brow .nm { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow.me .nm { color: #4dc3ff; }
  .brow .stats { font-size: 12px; opacity: .6; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap;
                 font-variant-numeric: tabular-nums; }
  .brow .score { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .brow .score b { display: block; font-size: 22px; line-height: 1; }
  .brow .score small { font-size: 10px; opacity: .55; text-transform: uppercase; letter-spacing: .5px; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
  th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid #222; white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; opacity: .6; font-weight: 600; }
  td:nth-child(2), th:nth-child(2) { text-align: left; }
  tr.me td { color: #4dc3ff; }
  .panel .close, .panel .ok { margin-top: 16px; background: #1f6feb; color: #fff; border: none; border-radius: 8px;
           padding: 8px 18px; cursor: pointer; font-size: 15px; }
  .panel input { width: 260px; padding: 10px 12px; font-size: 17px; border-radius: 8px; border: 1px solid #333;
           background: #000; color: #fff; outline: none; }
  .panel input:focus { border-color: #1f6feb; }
  .panel p { opacity: .7; margin: 0 0 12px; font-size: 14px; max-width: 320px; }
  .mute { position: fixed; top: 10px; left: 14px; z-index: 2; background: none; border: 1px solid #333;
          color: #aaa; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  body.shake .wrap { animation: shake .3s; }
  @keyframes shake {
    0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(7px,-5px)}
    60%{transform:translate(-5px,-3px)} 80%{transform:translate(4px,5px)}
  }

  @media (max-width: 600px) {
    .top3 { font-size: 12px; padding: 6px 10px; min-width: 0; max-width: 46vw; }
    .top3 h4 { font-size: 10px; margin-bottom: 3px; }
    .top3 button { padding: 3px 9px; font-size: 12px; margin-top: 5px; }
    .note { font-size: 10px; max-width: 46vw; }
    .wrap { margin-top: 110px; }
    .counter { font-size: 56px; }
  }
</style>
</head>
<body>
  <canvas id="fw"></canvas>
  <button class="mute" id="mute">🔊</button>
  <div class="top3" id="top3">
    <h4>Top 3 · Klicks/s</h4>
    <div id="top3list"><div class="empty">Noch keine Einträge</div></div>
    <button id="openBoard">Rangliste</button>
    <div class="note" id="boardNote"></div>
  </div>
  <div class="player">Spieler: <span id="pname">–</span><button id="rename">ändern</button></div>
  <div class="overlay" id="boardOv"><div class="panel">
    <h2>Rangliste</h2>
    <div class="blist" id="boardBody"></div>
    <p style="margin-top:12px;font-size:12px">Arbeit: 0,6 N Tastenkraft × 0,5 mm Tastenweg ≈ 0,3 mJ pro Klick.</p>
    <button class="close" id="closeBoard">Schließen</button>
  </div></div>
  <div class="overlay" id="nameOv"><div class="panel">
    <h2>Wie heißt du?</h2>
    <p>Dein Name erscheint in der Rangliste.</p>
    <input id="nameIn" maxlength="24" placeholder="Name eingeben" autocomplete="off">
    <br><button class="ok" id="nameOk">Los geht's</button>
  </div></div>
  <div class="wrap">
    <div class="counter" id="cps">0.0</div>
    <div class="unit">Klicks pro Sekunde</div>
    <div class="total">Punkte: <span id="count">0</span> · Klicks: <span id="real">0</span> · <span id="joule">0,000 J</span></div>
    <div class="level" id="level">Level 1 · Neuling</div>
    <button class="btn" id="bestellen">Bestellen</button>
    <div class="combo" id="combo"></div>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
/* ---------- Kein Zoomen / Verschieben ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1 || !e.target.closest('.panel')) e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('input')) {
    e.preventDefault();
    const b = e.target.closest('button');
    if (b) b.click();          // schneller Doppeltipp zählt trotzdem als Klick
  }
  lastTouchEnd = now;
}, { passive: false });

/* ---------- State ---------- */
let beatThisRun = false;
let count = 0, combo = 0, lastClick = 0, golden = false;
let best = 0;
try { best = parseFloat(localStorage.getItem('bestellen_best_cps') || '0') || 0; } catch(e) {}
const clicks = []; const WIN = 3000;
function cpsNow(){ const t = performance.now(); while (clicks.length && clicks[0] < t - WIN) clicks.shift(); return clicks.length / (WIN/1000); }
const $ = id => document.getElementById(id);
const levels = [
  [0,'Neuling'],[10,'Stammkunde'],[25,'Vielbesteller'],[50,'Shopping-Profi'],
  [100,'Kaufrausch'],[200,'Bestell-Maschine'],[350,'Lagerleerer'],[500,'Legende'],
  [750,'Halbgott des Warenkorbs'],[1000,'BESTELL-GOTT']
];
function levelIdx(n){ let i=0; for(let k=0;k<levels.length;k++) if(n>=levels[k][0]) i=k; return i; }
function updateBest(){ if (typeof board !== 'undefined' && board) renderTop3(); }
updateBest();

/* ---------- Audio ---------- */
let ac = null, muted = false, noiseBuf = null;
function audio(){
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    } catch(e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
  return ac;
}
function master(vol){
  const g = ac.createGain(); g.gain.value = vol; g.connect(ac.destination); return g;
}
function soundLaunch(dur){
  if (muted || !audio()) return;
  const t = ac.currentTime;
  // Pfeifen: steigender Ton
  const o = ac.createOscillator(), g = master(0);
  o.type = 'sine';
  o.frequency.setValueAtTime(500 + Math.random()*200, t);
  o.frequency.exponentialRampToValueAtTime(1800 + Math.random()*600, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.05);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); o.start(t); o.stop(t + dur + 0.05);
  // Zischen
  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3000; f.Q.value = 1.5;
  const ng = master(0);
  ng.gain.setValueAtTime(0.05, t); ng.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  n.connect(f); f.connect(ng); n.start(t, Math.random()); n.stop(t + dur);
}
function soundBoom(big){
  if (muted || !audio()) return;
  const t = ac.currentTime;
  // Knall: Rauschen durch Tiefpass
  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(big ? 2500 : 1800, t);
  f.frequency.exponentialRampToValueAtTime(120, t + (big ? 1.6 : 1.0));
  const g = master(0);
  g.gain.setValueAtTime(big ? 0.9 : 0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0005, t + (big ? 1.8 : 1.1));
  n.connect(f); f.connect(g); n.start(t, Math.random()); n.stop(t + 2);
  // Bass-Wumms
  const o = ac.createOscillator(), og = master(0);
  o.type = 'sine'; o.frequency.setValueAtTime(big ? 90 : 120, t);
  o.frequency.exponentialRampToValueAtTime(35, t + 0.4);
  og.gain.setValueAtTime(big ? 0.6 : 0.35, t); og.gain.exponentialRampToValueAtTime(0.0005, t + 0.5);
  o.connect(og); o.start(t); o.stop(t + 0.6);
  // Knistern
  for (let i=0;i<(big?14:6);i++){
    const tt = t + 0.25 + Math.random()*0.9;
    const c = ac.createBufferSource(); c.buffer = noiseBuf;
    const cf = ac.createBiquadFilter(); cf.type = 'highpass'; cf.frequency.value = 4000;
    const cg = master(0);
    cg.gain.setValueAtTime(0.12, tt); cg.gain.exponentialRampToValueAtTime(0.0005, tt + 0.03);
    c.connect(cf); cf.connect(cg); c.start(tt, Math.random()); c.stop(tt + 0.04);
  }
}
function soundClick(){
  if (muted || !audio()) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = master(0);
  o.type = 'triangle';
  o.frequency.value = 440 * Math.pow(2, Math.min(combo, 24) / 12); // steigt mit Combo
  g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.12);
  o.connect(g); o.start(t); o.stop(t + 0.15);
}
function soundFanfare(){
  if (muted || !audio()) return;
  const t = ac.currentTime;
  [523, 659, 784, 1047].forEach((fr, i) => {
    const o = ac.createOscillator(), g = master(0);
    o.type = 'square'; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t + i*0.1);
    g.gain.linearRampToValueAtTime(0.06, t + i*0.1 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0005, t + i*0.1 + (i===3 ? 0.6 : 0.15));
    o.connect(g); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.7);
  });
}
$('mute').addEventListener('click', () => {
  muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊';
});

/* ---------- Fireworks ---------- */
const cv = $('fw'), ctx = cv.getContext('2d');
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
const parts = [], rockets = [];
let running = false;
const colors = ['#ff4d4d','#ffd84d','#4dff88','#4dc3ff','#c44dff','#ff8c1a','#ff4dd2','#ffffff'];

function launch(opts = {}){
  const vy = -(cv.height*0.011 + Math.random()*cv.height*0.004);
  const ty = cv.height*(0.12 + Math.random()*0.3);
  rockets.push({
    x: opts.x ?? cv.width*(0.12+Math.random()*0.76), y: cv.height,
    vy, ty, big: !!opts.big, gold: !!opts.gold,
    c: opts.gold ? '#ffd84d' : colors[Math.random()*colors.length|0]
  });
  soundLaunch(0.7 + Math.random()*0.3);
  if(!running){ running = true; requestAnimationFrame(loop); }
}
function explode(r){
  const n = r.big ? 180 : 80 + Math.random()*40;
  const shape = Math.random();
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    let s = (r.big ? 2 : 1) + Math.random()*(r.big ? 7 : 5);
    if (shape < 0.25) s = r.big ? 6.5 : 4.5;            // Ring
    let c = r.c;
    if (r.gold) c = Math.random() < .5 ? '#ffd84d' : '#fff3a0';
    else if (shape > 0.8) c = colors[Math.random()*colors.length|0]; // bunt gemischt
    else if (Math.random() < 0.15) c = '#fff';
    parts.push({x:r.x, y:r.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1,
                decay: 0.008 + Math.random()*0.008, c, twinkle: Math.random() < 0.3});
  }
  soundBoom(r.big || r.gold);
}
function loop(){
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalCompositeOperation = 'lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.y += r.vy; r.vy *= 0.985;
    ctx.globalAlpha = 1; ctx.fillStyle = r.c;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.big ? 3.5 : 2.5, 0, 7); ctx.fill();
    // Funkenschweif
    parts.push({x:r.x, y:r.y, vx:(Math.random()-.5)*.6, vy:Math.random()*1.5, life:.5, decay:.03, c:'#ffb86b'});
    if(r.y <= r.ty || r.vy > -1){ explode(r); rockets.splice(i,1); }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay;
    if(p.life<=0){ parts.splice(i,1); continue; }
    ctx.globalAlpha = p.twinkle ? p.life * (0.4 + Math.random()*0.6) : p.life;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(rockets.length || parts.length) requestAnimationFrame(loop);
  else { running = false; ctx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------- UI helpers ---------- */
let toastTimer;
function toast(text, color){
  const t = $('toast'); t.textContent = text; t.style.color = color || '#fff';
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}
function shake(){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); }

/* ---------- Combo decay ---------- */
setInterval(() => {
  if (combo > 0 && performance.now() - lastClick > 900) {
    combo = 0; $('combo').textContent = ''; $('bar').style.width = '0';
    beatThisRun = false;
  }
  $('cps').textContent = cpsNow().toFixed(1);
}, 100);

/* ---------- Click ---------- */
const btn = $('bestellen');
btn.addEventListener('click', () => {
  audio();
  const now = performance.now();
  combo = (now - lastClick < 900) ? combo + 1 : 1;
  lastClick = now;

  const mult = combo >= 30 ? 4 : combo >= 15 ? 3 : combo >= 6 ? 2 : 1;
  const wasGold = golden;
  const gain = wasGold ? 10 * mult : mult;
  const oldLevel = levelIdx(count);
  count += gain;

  // Zähler
  clicks.push(now);
  realClicks++;
  $('real').textContent = realClicks;
  $('joule').textContent = fmtJ(realClicks * J_PER_CLICK);
  const cps = cpsNow();
  $('count').textContent = count;
  const c = $('cps'); c.textContent = cps.toFixed(1);
  c.classList.add('pop'); setTimeout(() => c.classList.remove('pop'), 80);

  // Combo-Anzeige
  $('combo').textContent = combo > 1 ? `Combo ×${combo}` + (mult > 1 ? `  ·  ${mult}× Punkte` : '') : '';
  $('bar').style.width = Math.min(100, combo / 30 * 100) + '%';

  soundClick();

  // Feuerwerk – mehr Raketen bei höherer Combo
  const rx = btn.getBoundingClientRect();
  const n = wasGold ? 10 : 1 + Math.min(4, Math.floor(combo / 5));
  launch({ x: rx.left + rx.width/2, gold: wasGold, big: wasGold });
  for (let i=1;i<n;i++) setTimeout(() => launch({ gold: wasGold }), i * 160);

  if (wasGold) { toast('✨ GOLDENER KLICK +' + gain + ' ✨', '#ffd84d'); shake(); }

  // Level-Up
  const newLevel = levelIdx(count);
  if (newLevel > oldLevel) {
    $('level').textContent = `Level ${newLevel+1} · ${levels[newLevel][1]}`;
    toast('LEVEL UP: ' + levels[newLevel][1] + '!', '#4dff88');
    soundFanfare(); shake();
    for (let i=0;i<6;i++) setTimeout(() => launch({ big: true }), 200 + i*180);
  } else if (count % 50 < gain && count >= 50 && !wasGold) {
    toast(count + '!', '#4dc3ff');
  }

  // Rekord (Klicks pro Sekunde)
  if (cps > best) {
    const first = best > 0 && !beatThisRun;
    beatThisRun = true;
    best = cps; updateBest();
    try { localStorage.setItem('bestellen_best_cps', String(best)); } catch(e) {}
    if (first) toast('NEUER REKORD!', '#ff4dd2');
  }
  saveLocal();
  scheduleSave();

  // Button wächst leicht mit der Combo
  btn.style.setProperty('--size', (220 + Math.min(combo, 30) * 2) + 'px');
  clearTimeout(btn._shrink);
  btn._shrink = setTimeout(() => btn.style.setProperty('--size', '220px'), 950);

  // Nächster Klick golden? (ca. 1:25)
  golden = Math.random() < 0.04;
  btn.classList.toggle('gold', golden);
  btn.textContent = golden ? '★ Bestellen ★' : 'Bestellen';
});

/* ---------- Spieler, Arbeit, Rangliste ---------- */
var J_PER_CLICK = 0.6 * 0.0005;   // 0,6 N × 0,5 mm
var realClicks = 0, playerName = '', myId = null;
var board = [];                   // [{id,name,maxCps,clicks}]
try {
  realClicks = parseInt(localStorage.getItem('bestellen_clicks') || '0', 10) || 0;
  playerName = localStorage.getItem('bestellen_name') || '';
} catch(e) {}
function fmtJ(j){ return j < 1 ? (j*1000).toFixed(1).replace('.', ',') + ' mJ' : j.toFixed(3).replace('.', ',') + ' J'; }
function fmtCps(v){ return (v || 0).toFixed(1).replace('.', ','); }
function esc(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function saveLocal(){
  try { localStorage.setItem('bestellen_clicks', String(realClicks)); } catch(e) {}
}
$('real').textContent = realClicks;
$('joule').textContent = fmtJ(realClicks * J_PER_CLICK);

function meEntry(){ return { id: myId || 'local', name: playerName || 'Du', maxCps: best, clicks: realClicks, me: true }; }
function merged(){
  const list = board.filter(e => e.id !== myId).map(e => ({...e}));
  list.push(meEntry());
  return list.sort((a,b) => (b.maxCps||0) - (a.maxCps||0));
}
function renderTop3(){
  const list = merged().filter(e => e.maxCps > 0).slice(0, 3);
  const medals = ['🥇','🥈','🥉'];
  $('top3list').innerHTML = list.length
    ? list.map((e,i) => `<div class="row${e.me ? ' me' : ''}"><span>${medals[i]} ${esc(e.name)}</span><b>${fmtCps(e.maxCps)}</b></div>`).join('')
    : '<div class="empty">Noch keine Einträge</div>';
  if ($('boardOv').classList.contains('show')) renderBoard();
}
function renderBoard(){
  $('boardBody').innerHTML = merged().map((e,i) =>
    `<div class="brow${e.me ? ' me' : ''}${i < 3 ? ' podium' : ''}">` +
      `<div class="rank">${i < 3 ? ['🥇','🥈','🥉'][i] : i+1}</div>` +
      `<div class="who"><div class="nm">${esc(e.name)}</div>` +
        `<div class="stats"><span>${(e.clicks||0).toLocaleString('de-AT')} Klicks</span><span>${fmtJ((e.clicks||0) * J_PER_CLICK)}</span></div></div>` +
      `<div class="score"><b>${fmtCps(e.maxCps)}</b><small>Klicks/s</small></div>` +
    `</div>`).join('') || '<div class="empty">Noch keine Einträge</div>';
}
$('openBoard').addEventListener('click', () => { renderBoard(); $('boardOv').classList.add('show'); });
$('closeBoard').addEventListener('click', () => $('boardOv').classList.remove('show'));
$('boardOv').addEventListener('click', e => { if (e.target.id === 'boardOv') $('boardOv').classList.remove('show'); });

/* Name */
function setName(n){
  playerName = n.trim().slice(0, 24);
  $('pname').textContent = playerName || '–';
  try { localStorage.setItem('bestellen_name', playerName); } catch(e) {}
  renderTop3(); scheduleSave();
}
function askName(){
  $('nameIn').value = playerName; $('nameOv').classList.add('show');
  setTimeout(() => $('nameIn').focus(), 50);
}
function confirmName(){
  const v = $('nameIn').value.trim();
  if (!v) { $('nameIn').focus(); return; }
  setName(v); $('nameOv').classList.remove('show');
}
$('nameOk').addEventListener('click', confirmName);
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });
$('rename').addEventListener('click', askName);
btn.addEventListener('click', e => {
  if (!playerName) { askName(); }
}, true);
$('pname').textContent = playerName || '–';

/* ---------- Geteilte Rangliste über Netlify ---------- */
try {
  myId = localStorage.getItem('bestellen_id');
  if (!myId) { myId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)); localStorage.setItem('bestellen_id', myId); }
} catch(e) { myId = 'tmp-' + Math.random().toString(36).slice(2); }
myId = myId.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40);

let mySeason = null;
try { mySeason = localStorage.getItem('bestellen_season'); } catch(e) {}
// Nach einem Reset der Rangliste: eigene Werte auf 0 setzen
function checkSeason(r){
  const srv = r.headers.get('X-Season');
  if (!srv || srv === mySeason) return false;
  const wasReset = mySeason !== null;
  mySeason = srv;
  try { localStorage.setItem('bestellen_season', srv); } catch(e) {}
  if (!wasReset) return false;
  best = 0; realClicks = 0; count = 0; beatThisRun = false;
  try { localStorage.setItem('bestellen_best_cps', '0'); } catch(e) {}
  saveLocal();
  $('count').textContent = 0; $('real').textContent = 0; $('joule').textContent = fmtJ(0);
  $('level').textContent = 'Level 1 · ' + levels[0][1];
  board = []; renderTop3();
  toast('Neue Runde – Rangliste zurückgesetzt!', '#ffd84d');
  return true;
}
function payload(){
  const p = { id: myId, name: playerName, maxCps: Math.round(best * 10) / 10, clicks: realClicks };
  if (mySeason !== null) p.season = mySeason;
  return JSON.stringify(p);
}
let saveTimer = null, saving = false, dirty = false;
function scheduleSave(){
  if (!playerName) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1500);
}
async function doSave(){
  if (saving) { saveTimer = setTimeout(doSave, 800); return; }
  if (!dirty) return;
  dirty = false; saving = true;
  try {
    const r = await fetch('/api/scores', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: payload()
    });
    checkSeason(r);
    if (r.ok) { applyBoard(await r.json()); $('boardNote').textContent = ''; }
    else if (r.status === 409) { /* Runde wurde zurückgesetzt, Werte sind schon auf 0 */ }
    else $('boardNote').textContent = 'Speichern fehlgeschlagen.';
  } catch (e) {
    dirty = true; $('boardNote').textContent = 'Rangliste nicht erreichbar.';
  } finally { saving = false; }
}
addEventListener('pagehide', () => {
  if (!dirty || !playerName) return;
  try {
    navigator.sendBeacon('/api/scores', new Blob([payload()], { type: 'application/json' }));
  } catch(e) {}
});

function applyBoard(rows){
  if (!Array.isArray(rows)) return;
  board = rows.map(v => ({ id: String(v.id || ''), name: String(v.name || 'Jemand').slice(0, 24),
                           maxCps: Number(v.maxCps) || 0, clicks: Number(v.clicks) || 0 }));
  const mine = board.find(e => e.id === myId);
  if (mine) {
    if (mine.maxCps > best) { best = mine.maxCps; try { localStorage.setItem('bestellen_best_cps', String(best)); } catch(e) {} }
    if (mine.clicks > realClicks) { realClicks = mine.clicks; saveLocal(); $('real').textContent = realClicks; $('joule').textContent = fmtJ(realClicks * J_PER_CLICK); }
  }
  renderTop3();
}
async function loadBoard(){
  try {
    const r = await fetch('/api/scores', { cache: 'no-store' });
    checkSeason(r);
    if (r.ok) { applyBoard(await r.json()); if ($('boardNote').textContent === 'Rangliste nicht erreichbar.') $('boardNote').textContent = ''; }
    else $('boardNote').textContent = 'Rangliste nicht erreichbar.';
  } catch (e) { $('boardNote').textContent = 'Rangliste nicht erreichbar.'; }
}
renderTop3();
loadBoard();
setInterval(() => { if (!document.hidden) loadBoard(); }, 5000);
if (!playerName) askName();
</script>
</body>
</html>
